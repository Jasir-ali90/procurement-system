<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="plumPeachRibbon" x1="20" y1="180" x2="180" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#461756"/>
      <stop offset="40%" stop-color="#7B1E8B"/>
      <stop offset="75%" stop-color="#E05375"/>
      <stop offset="100%" stop-color="#FF7E5F"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="120" y1="80" x2="185" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FFA088"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF7E5F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Stylized 'e' Ribbon Swirl -->
  <path d="M 40 125 
           C 25 105, 45 40, 95 35 
           C 135 30, 140 75, 110 115 
           C 80 155, 40 145, 55 115 
           C 70 85, 110 95, 160 40" 
        stroke="url(#plumPeachRibbon)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" />

  <!-- Dynamic Arrow Tip at top right -->
  <path d="M 140 25 L 180 20 L 175 60 Z" 
        fill="url(#arrowGradient)" 
        filter="url(#glow)" />
</svg>
